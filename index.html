<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hafıza Deneyi</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;background:#f4f0e9;font-family:Arial,sans-serif;color:#333;display:flex;align-items:center;justify-content:center;text-align:center}
.container{width:100%;max-width:620px;background:#fff;padding:28px 22px;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{color:#4b4946;margin-top:0}
p{line-height:1.6}
button{background:#687b68;color:white;border:0;border-radius:10px;padding:15px 30px;font-size:18px;margin-top:16px;cursor:pointer}
#message{margin-top:18px;font-weight:bold;color:#687b68}
</style>
</head>
<body>
<div class="container">
<h1>Hafıza Deneyi</h1>
<p>Oda görselini dikkatlice incele ve gördüğün nesneleri aklında tut.</p>
<p>Hazır olduğunda aşağıdaki butona bas.</p>
<button type="button" onclick="startTest()">BAŞLAT</button>
<p id="message" aria-live="polite"></p>
</div>
<script>
function startTest(){document.getElementById('message').textContent='Başlat butonu çalışıyor!';}
</script>
</body>
</html>
